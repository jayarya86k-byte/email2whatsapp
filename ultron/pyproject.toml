[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-agent"
version = "0.1.0"
description = "Ultron: a private, offline, local-model super agent with a dashboard, voice and Indian tax/GST automation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ultron" }]
keywords = ["local-llm", "offline", "agent", "voice", "gst", "income-tax", "challan"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
# No runtime dependencies: the core runs on the standard library alone.
dependencies = []

[project.optional-dependencies]
voice = ["faster-whisper>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
ultron = "ultron.cli:main"

[tool.setuptools]
packages = [
  "ultron",
  "ultron.core",
  "ultron.security",
  "ultron.tools",
  "ultron.finance",
  "ultron.voice",
  "ultron.server",
]

[tool.setuptools.package-data]
"ultron.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
